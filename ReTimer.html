<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReTimer 照護者負擔量表</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hamd.css">
  <link rel="stylesheet" href="retimer.css">
  <script src="xlsx.js" defer></script>
  <script src="vendor/pdf-lib.min.js" defer></script>
  <script src="retimer-form.js" defer></script>
  <script src="retimer.js" defer></script>
  <script src="nas-upload.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="hero">
      <a class="back-link" href="Psqi.html">← 返回 PSQI 計算機</a>
      <div class="eyebrow">RETIMER · CAREGIVER BURDEN</div>
      <h1>ReTimer 照護者負擔量表</h1>
      <div class="hero-stats"><span id="retimer-progress">已填 0 / 24 題</span></div>
    </header>
    <main class="retimer-layout">
      <form id="retimer-form" class="card retimer-card">
        <h2>日期與患者編號</h2>
        <div class="identity-grid">
          <label class="field">Date <input name="date" type="date" required></label>
          <label class="field">患者編號（選填）<input name="patientId" type="text" maxlength="100"></label>
          <label class="field">填寫次數（選填）<select name="visitNumber"><option value="">未指定</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label>
        </div>
        <p class="retimer-help">依原始 PDF 右欄內容填答。每題 0–4 分，總分最高 96 分；分數越高，照護負擔越重。</p>
        <div id="retimer-questions"></div>
        <div class="hamd-actions">
          <button class="button secondary" type="button" id="retimer-calculate">計算分數</button>
          <button class="button primary" type="submit">儲存填答</button>
          <button class="button secondary" type="reset">清除填答</button>
        </div>
        <p id="retimer-feedback" class="save-feedback" role="status" aria-live="polite"></p>
      </form>
      <aside class="card retimer-result" id="retimer-result" aria-live="polite" hidden>
        <div class="result-heading"><span class="badge">計算結果</span><span>ReTimer</span></div>
        <div class="total"><strong id="retimer-total">—</strong><span>/ 96 分</span></div>
        <p>分數越高，照護負擔越重。</p>
      </aside>
    </main>
    <section class="card records-card" aria-labelledby="retimer-records-title">
      <div class="records-head">
        <div><h2 id="retimer-records-title">已儲存 ReTimer 紀錄：<span id="retimer-count">0</span> 筆</h2><p>每筆紀錄可回看、輸出 PDF 或刪除。</p></div>
        <button class="button primary" type="button" id="nas-upload-btn" disabled>上傳至 NAS</button>
      </div>
      <p id="nas-upload-status" class="record-status" role="status" aria-live="polite" hidden></p>
      <p id="retimer-record-status" class="record-status" role="status" aria-live="polite"></p>
      <div id="retimer-record-list" class="record-list"></div>
    </section>
    <footer>中國醫藥大學北港附設醫院 穿戴式科技與高齡醫學實驗室</footer>
  </div>
  <dialog id="nas-login-dialog" class="nas-login-dialog" aria-labelledby="nas-login-title">
    <form method="dialog" id="nas-login-form">
      <h2 id="nas-login-title">NAS 上傳密碼</h2>
      <p>每次開啟網頁首次上傳時輸入。密碼透過 HTTPS 傳送至 NAS，關閉網頁後不保留。</p>
      <label for="nas-password">上傳密碼</label>
      <input id="nas-password" type="password" autocomplete="current-password" required>
      <p id="nas-login-error" class="record-status" role="alert"></p>
      <div class="nas-login-actions">
        <button class="button secondary" type="button" id="nas-login-cancel">取消</button>
        <button class="button primary" type="submit" id="nas-login-submit">登入並上傳</button>
      </div>
    </form>
  </dialog>
</body>
</html>
